<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 静态兜底：脚本运行后会按当前页面改写为对应的规范地址 -->

    <!-- 分享卡片 -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Andycommander66">
    <meta property="og:url" content="https://andycommander66.cn/">
    <meta property="og:title" content="Andycommander66 · 个人主页">
    <meta property="og:description" content="计算机科学与技术专业在读 · IPET 智能光电技术实验室成员 · 科研、竞赛与工程实践">

    <meta name="twitter:title" content="Andycommander66 · 个人主页">

    <script>
        // 开屏判定必须早于首次绘制：只在本次会话首次进入时播放
        (function () {
            var root = document.documentElement;
            root.classList.add('js');
            var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var first = false;
            try {
                first = !sessionStorage.getItem('ac66-booted');
            } catch (e) {
                first = false;
            }
            if (first && !reduce) {
                try {
                    sessionStorage.setItem('ac66-booted', '1');
                } catch (e) { }
                root.classList.add('booting');
            } else {
                root.classList.add('boot-done');
            }
        })();
    </script>
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
